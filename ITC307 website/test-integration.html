<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Integration Test - Fiji Task Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fas fa-cog me-2"></i>Google Sheets Integration Test
                        </h4>
                    </div>
                    <div class="card-body">
                        <div id="testResults">
                            <div class="text-center">
                                <i class="fas fa-spinner fa-spin fa-2x text-primary mb-3"></i>
                                <p>Testing Google Sheets integration...</p>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <h5>Test Tasks</h5>
                                <button class="btn btn-primary btn-sm" onclick="testGetTasks()">
                                    <i class="fas fa-download me-1"></i>Get Tasks
                                </button>
                                <button class="btn btn-success btn-sm ms-2" onclick="testAddTask()">
                                    <i class="fas fa-plus me-1"></i>Add Test Task
                                </button>
                            </div>
                            <div class="col-md-6">
                                <h5>Test Bids</h5>
                                <button class="btn btn-warning btn-sm" onclick="testGetBids()">
                                    <i class="fas fa-download me-1"></i>Get Bids
                                </button>
                                <button class="btn btn-info btn-sm ms-2" onclick="testAddBid()">
                                    <i class="fas fa-plus me-1"></i>Add Test Bid
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <h5>API Status</h5>
                            <div id="apiStatus" class="alert alert-info">
                                Checking API status...
                            </div>
                        </div>
                        
                        <div class="mt-3">
                            <a href="home.html" class="btn btn-outline-primary">
                                <i class="fas fa-home me-1"></i>Back to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/google-sheets-api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Test functions
        async function testGetTasks() {
            try {
                const tasks = await window.FijiTaskApp.GoogleSheetsAPI.getTasks();
                showResult('Get Tasks', `Successfully retrieved ${tasks.length} tasks`, 'success');
                console.log('Tasks:', tasks);
            } catch (error) {
                showResult('Get Tasks', `Error: ${error.message}`, 'danger');
            }
        }

        async function testAddTask() {
            try {
                const testTask = {
                    title: 'Test Task - ' + new Date().toLocaleString(),
                    category: 'Testing',
                    description: 'This is a test task for API integration',
                    budget: '$50-100',
                    location: 'Test Location',
                    poster: {
                        name: 'Test User',
                        rating: 4.5,
                        avatar: 'TU'
                    }
                };
                
                const result = await window.FijiTaskApp.GoogleSheetsAPI.addTask(testTask);
                showResult('Add Task', 'Task added successfully', 'success');
                console.log('Add Task Result:', result);
            } catch (error) {
                showResult('Add Task', `Error: ${error.message}`, 'danger');
            }
        }

        async function testGetBids() {
            try {
                const bids = await window.FijiTaskApp.GoogleSheetsAPI.getBids(1);
                showResult('Get Bids', `Successfully retrieved ${bids.length} bids for task 1`, 'success');
                console.log('Bids:', bids);
            } catch (error) {
                showResult('Get Bids', `Error: ${error.message}`, 'danger');
            }
        }

        async function testAddBid() {
            try {
                const testBid = {
                    taskId: 1,
                    bidder: {
                        name: 'Test Bidder',
                        rating: 4.8,
                        avatar: 'TB'
                    },
                    amount: 75,
                    estimatedTime: '2-3 hours',
                    message: 'This is a test bid for API integration'
                };
                
                const result = await window.FijiTaskApp.GoogleSheetsAPI.addBid(testBid);
                showResult('Add Bid', 'Bid added successfully', 'success');
                console.log('Add Bid Result:', result);
            } catch (error) {
                showResult('Add Bid', `Error: ${error.message}`, 'danger');
            }
        }

        function showResult(testName, message, type) {
            const resultsDiv = document.getElementById('testResults');
            const alertClass = `alert alert-${type}`;
            
            resultsDiv.innerHTML = `
                <div class="${alertClass}">
                    <h6>${testName}</h6>
                    <p class="mb-0">${message}</p>
                </div>
            `;
        }

        // Initialize test page
        document.addEventListener('DOMContentLoaded', async function() {
            const apiStatusDiv = document.getElementById('apiStatus');
            
            try {
                // Test API initialization
                const isAvailable = await window.FijiTaskApp.GoogleSheetsAPI.init();
                
                if (isAvailable) {
                    apiStatusDiv.className = 'alert alert-success';
                    apiStatusDiv.innerHTML = `
                        <i class="fas fa-check-circle me-2"></i>
                        Google Sheets API is available and working
                    `;
                } else {
                    apiStatusDiv.className = 'alert alert-warning';
                    apiStatusDiv.innerHTML = `
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Google Sheets API not available, using local storage fallback
                    `;
                }
                
                // Show initial status
                showResult('API Test', 'Integration test completed', 'info');
                
            } catch (error) {
                apiStatusDiv.className = 'alert alert-danger';
                apiStatusDiv.innerHTML = `
                    <i class="fas fa-times-circle me-2"></i>
                    Error: ${error.message}
                `;
                
                showResult('API Test', `Error: ${error.message}`, 'danger');
            }
        });
    </script>
</body>
</html>
